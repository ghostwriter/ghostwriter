name: Build

on:
  workflow_dispatch:
  push:
  pull_request:
  schedule:
    - cron: "*/15 * * * *"
jobs:
  markscribe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # 7.0.0
        with:
          go-version: '1.26'

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # 7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - run: |
          set -euo pipefail
          git config --global commit.gpgsign true
          git config --global gpg.format ssh
          git config --global user.email "nathanael.esayeas@protonmail.com"
          git config --global user.name "Nathanael Esayeas"
          git config --global user.signingkey "key::${{ secrets.SSH_PUBLIC_KEY }}"

          go install github.com/muesli/markscribe@latest
          markscribe -write README.md templates/README.md.tpl

          if git status --porcelain README.md | grep -q 'README.md'; then
            echo "Changes detected in README.md"

            eval "$(ssh-agent -s)"
            echo "${{ secrets.SSH_PRIVATE_KEY }}" | ssh-add -

            git reset --soft $(git rev-list --max-parents=0 HEAD)
            git add .
            git commit --amend -S --signoff -m "Update README.md"
            git remote set-url origin git@github.com:${{ github.repository }}.git
            git push --force-with-lease
          else
            echo "No changes detected."
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.PAT }}
